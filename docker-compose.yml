services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: app:local
    profiles: ["app"]
    ports:
      - "3000:3000"
    environment:
      APP_NAME: ${APP_NAME:-ts-modular-boilerplate}
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-unversioned}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-app}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    networks:
      - backend
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
