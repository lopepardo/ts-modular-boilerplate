info:
  name: Get expense
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/expenses/:id"
  params:
    - name: id
      value: "{{expenseId}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
