info:
  name: List books
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/books?title=habits&author=clear&isbn=978-0735211292&retired=false"
  params:
    - name: title
      value: habits
      type: query
    - name: author
      value: clear
      type: query
    - name: isbn
      value: 978-0735211292
      type: query
    - name: retired
      value: "false"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
