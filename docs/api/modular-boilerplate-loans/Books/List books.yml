info:
  name: List books
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/books?author=clear&retired=false"
  params:
    - name: author
      value: clear
      type: query
    - name: retired
      value: "false"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
